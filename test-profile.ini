# dconf settings loaded into the isolated test profile (make test-profile).

[org/gnome/shell]
enabled-extensions=['@UUID@']
welcome-dialog-last-shown-version='999'

[org/gnome/desktop/wm/preferences]
focus-mode='sloppy'

# Window management shortcuts use <Alt> instead of <Super> so they reach the
# nested shell rather than being handled by the outer session.
[org/gnome/mutter/keybindings]
toggle-tiled-left=['<Alt>Left']
toggle-tiled-right=['<Alt>Right']

[org/gnome/desktop/wm/keybindings]
maximize=['<Alt>Up']
unmaximize=['<Alt>Down']
switch-to-workspace-left=['<Alt>Page_Up']
switch-to-workspace-right=['<Alt>Page_Down']
move-to-workspace-left=['<Alt><Shift>Page_Up']
move-to-workspace-right=['<Alt><Shift>Page_Down']
move-to-monitor-left=['<Alt><Shift>Left']
move-to-monitor-right=['<Alt><Shift>Right']
